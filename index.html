<!DOCTYPE html>
<html lang="en">
<head>
    <title>Damian</title>
    <link rel="preload" href="/fonts/EBGaramond-Regular-subset.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Photography, programming, and other personal projects.">
    <meta charset="UTF-8">

    <style>
    @font-face {
        font-family: "EBGaramond";
        src: url("/fonts/EBGaramond-Regular-subset.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: auto;
    }

    html.font-loading body {
        visibility: hidden;
    }
    
    body {
        font-family: "EBGaramond", Georgia, serif;
        font-size: 1.15rem;
    }

    p {
        max-width: 75ch;
        hyphens: auto;
        overflow-wrap: break-word;
    }

    h2 {
        font-size: 1.12rem;
    }

    </style>

    <!-- prevents body from being rendered before font loading to prevent flash of unstyled text-->
    <script>
        document.documentElement.classList.add("font-loading");

        const showPage = () => {
            document.documentElement.classList.remove("font-loading");
        };

        document.fonts
            .load('1em "EBGaramond"')
            .then(showPage, showPage);
    </script>
</head>

<body>
    <p>
        Hello, world! <br>I'm a math undergraduate and programmer with a growing interest in scientific computing. Feedback or suggestions are always welcome at <a href="mailto:damianhsimon@gmail.com">damianhsimon@gmail.com</a>. 


    <p> 
    [ <a href="/cv.pdf">curriculum vitae</a> ] <br>
    [ <a href="https://github.com/damianlofi">github</a> ] <br>
    </p>

</body>
</html>
